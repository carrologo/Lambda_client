service: my-serverless-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_KEY: ${env:SUPABASE_KEY}

plugins:
  - serverless-offline

functions:
  LambdaClient:
    name: LambdaClient-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.createClientHandler
    events:
      - http:
          path: /clients
          method: post
          cors: true

  LambdaGetClients:
    name: LambdaGetClients-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getAllClientsHandler
    events:
      - http:
          path: /clients
          method: get
          cors: true

  LambdaUpdateClient:
    name: LambdaUpdateClient-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.updateClientHandler
    events:
      - http:
          path: /clients/{id}
          method: patch
          cors: true

  LambdaGetClientById:
    name: LambdaGetClientById-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getClientByIdHandler
    events:
      - http:
          path: /clients/{id}
          method: get
          cors: true
            